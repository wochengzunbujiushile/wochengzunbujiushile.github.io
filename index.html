    /* 主视觉区域——深邃熔炉感 */
    .hero {

      z-index: 0;

    .container {

      width: 100%;
      text-align: center;

    @keyframes pulseGlow {

    h1 {

      font-weight: 800;
      letter-spacing: 10px;

      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;

    .subtitle {
